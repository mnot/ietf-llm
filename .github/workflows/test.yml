# DO NOT EDIT outside marked project regions — managed by https://github.com/mnot/pyproject-tmpl
name: Test

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    # === pyproject-tmpl: start "pre-test" ===
    # === pyproject-tmpl: end "pre-test" ===
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache venv
      uses: actions/cache@v6
      with:
        path: .venv
        key: ${{ runner.os }}-${{ matrix.python-version }}-venv-${{ hashFiles('pyproject.toml') }}
    - name: Set up venv
      run: make venv
    - name: Typecheck
      run: make typecheck
    - name: Lint
      run: make lint
    - name: Test
      run: make test
    # === pyproject-tmpl: start "post-test" ===
    # The vendored Agent Skills are copies of mnot/ietf-skill at the tag pinned
    # in VENDORED.md; nothing else notices if they drift from it. One Python
    # version only -- the answer cannot differ across the matrix, and this hits
    # the GitHub API.
    - name: Check vendored skills match their pin
      if: matrix.python-version == '3.13'
      run: make vendor-skills-check
    # === pyproject-tmpl: end "post-test" ===
