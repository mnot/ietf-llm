[project]
name = "ietf-llm"
dynamic = ["version"]
authors = [
    {name="Mark Nottingham", email="mnot@mnot.net"}
]
description = "Maintain a local, LLM-queryable corpus of an IETF Working Group's public record (drafts, mailing list, GitHub issues, meetings), with an MCP server, semantic search, and NotebookLM export."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta"
]

dependencies = [
    # Core gather / parse
    "requests",
    "beautifulsoup4",
    "pypdf",
    # Pure-Python git client used to sync the meeting-transcripts data repo,
    # so gather needs no `git` binary and isn't subject to the GitHub REST
    # API rate limit (it speaks the smart-HTTP git protocol). Floor: 0.21.7
    # is the oldest release whose `porcelain.pull` updates the working tree
    # (older releases only moved refs, leaving the checkout stale).
    "dulwich>=0.21.7",
    # NotebookLM Enterprise export (Google auth) is the optional `notebooklm`
    # extra -- mirror-mode export needs none of it; only the push does.
    # Digests, semantic search index, MCP server — all first-class features.
    # On-device embeddings (sentence-transformers / torch) are the optional
    # `local-embeddings` extra so a plain install stays torch-free and can
    # serve / index against a remote OpenAI-compatible endpoint instead.
    "llm",
    "numpy",
    "mcp",
    # Shell tab-completion (completes cached WG shortnames)
    "argcomplete",
]

[project.optional-dependencies]
# On-device embeddings: pulls sentence-transformers (and torch). Without
# this, the local `sentence-transformers/...` default model is unavailable
# and the embedding backend must be a remote `openai-embed/...` endpoint.
# Kept out of base so the serving/ingest image stays torch-free.
local-embeddings = ["llm-sentence-transformers"]
# NotebookLM Enterprise export: Google auth libraries. Only the
# `ietf-llm-export` NotebookLM push needs these; mirror mode does not.
notebooklm = [
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]
# S3-compatible object store for the cloud blob plane (corpus_blobs_s3).
# Only the `cloud` store backend with an `s3://` IETF_LLM_BLOB_DIR needs it;
# the default file:// blob store and base install do not.
s3 = ["boto3"]
# Behaviour-shaping extras (not feature-gating)
certs = ["pip-system-certs"]
dev = [
    "mypy",
    "black",
    "pylint",
    "pytest",
    "pytest-md",
    "validate-pyproject",
    "build",
    "types-requests",
    "types-beautifulsoup4",
    # Optional runtime deps that must be present to lint / typecheck the
    # optional modules (notebooklm.py imports google at module scope;
    # corpus_blobs_s3.py imports boto3). Torch is deliberately NOT here -- the
    # local-embeddings path is lazily imported, so it lints without it and CI
    # stays torch-free.
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "boto3",
    "moto",
]

[project.urls]
Homepage = "https://github.com/mnot/ietf-llm"
Documentation = "https://github.com/mnot/ietf-llm/blob/main/docs/README.md"
Source = "https://github.com/mnot/ietf-llm"
Issues = "https://github.com/mnot/ietf-llm/issues"

[project.scripts]
ietf-llm = "ietf_llm.__main__:main"
ietf-llm-export = "ietf_llm.export_cli:main"
ietf-llm-search = "ietf_llm.search_cli:main"
ietf-llm-mcp = "ietf_llm.mcp_server:main"


[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "ietf_llm.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ietf_llm", "ietf_llm.*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ietf_llm = ["py.typed", "data/skill/**/*"]

