# Prose linting for the MCP surface: the `instructions` field and the tool
# docstrings, which every client pays for in context on every session.
#
# Run it via `scripts/lint-prose.sh` (extracts the docstrings first — they live
# inside `def`s, indented, so vale would otherwise read them as code blocks).
# Needs `vale` on PATH: `brew install vale`.
#
# Deliberately NOT based on Microsoft/Google styles. Those are written for user
# documentation and would flag most of this surface for passive voice and long
# sentences: the register here is terse and technical on purpose. The rules in
# styles/ietf-llm/ target the one thing that matters for a context budget —
# words that cost tokens without adding meaning.

StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Vale, ietf-llm

# Protocol names, draft slugs and tool identifiers are not misspellings, and a
# vocabulary big enough to cover them would need more upkeep than it earns.
Vale.Spelling = NO
